<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>OshinWiFi</title>
    <style>
        :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; color: #17212b; background: #f4f6f8; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
        .container { width: 100%; max-width: 380px; padding: 32px 24px; background: #fff; border: 1px solid #e5e9ee; border-radius: 16px; }
        .header { text-align: center; margin-bottom: 28px; }
        h1 { margin: 0; font-size: 30px; letter-spacing: -1px; font-weight: 750; }
        .header p, .muted { color: #596674; font-size: 14px; line-height: 1.5; }
        .header p { margin: 8px 0 0; }
        .free-details { margin: 0 0 12px; text-align: center; color: #596674; font-size: 13px; }
        button { width: 100%; min-height: 48px; padding: 12px 16px; border: 1px solid #146a57; border-radius: 9px; background: #146a57; color: #fff; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
        button:hover { background: #105744; }
        button:disabled { opacity: .6; cursor: wait; }
        button:focus-visible, input:focus-visible { outline: 3px solid #83cbbb; outline-offset: 3px; }
        .secondary { background: #fff; color: #146a57; }
        .secondary:hover { background: #f0f7f4; }
        .divider { display: flex; align-items: center; gap: 14px; color: #697581; font-size: 12px; margin: 24px 0; }
        .divider::before, .divider::after { content: ""; height: 1px; background: #e5e9ee; flex: 1; }
        label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; }
        input { display: block; width: 100%; min-width: 0; min-height: 48px; padding: 12px; margin-bottom: 12px; border: 1px solid #c9d1d8; border-radius: 9px; background: #fff; font: inherit; font-size: 20px; letter-spacing: 6px; text-align: center; }
        input::placeholder { color: #89939d; }
        .footer { margin: 20px 0 0; text-align: center; font-size: 12px; line-height: 1.5; color: #697581; }
        .status { display: none; margin-bottom: 18px; padding: 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
        .status.error { display: block; background: #fff1f0; color: #a12922; }
        .status.success { display: block; background: #ecf8f1; color: #146a57; }
        .connected-box { text-align: center; }
        .connected-box h2 { margin: 0 0 8px; font-size: 20px; }
        .timer { margin: 16px 0 4px; font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -1px; color: #146a57; }
        .session-details { margin-top: 20px; font-size: 13px; color: #596674; overflow-wrap: anywhere; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main class="container">
        <header class="header">
            <h1>OshinWiFi</h1>
            <p>Welcome. Choose how to connect.</p>
        </header>
        <div id="portal-content">
            <div id="status-box" class="status" role="status" aria-live="polite"></div>
            <section id="starter-card" aria-label="Free guest access">
                <p class="free-details">Free · 30 minutes · 1 Mbps Limit</p>
                <button id="starter-btn" type="button">Continue as Guest</button>
                <div class="divider" aria-hidden="true">or</div>
            </section>
            <form id="voucher-form">
                <label for="voucher-code">6-digit access code</label>
                <input type="text" id="voucher-code" maxlength="6" minlength="6" inputmode="numeric" pattern="[0-9]{6}" placeholder="000000" autocomplete="off" required>
                <button type="submit" id="voucher-btn" class="secondary">Continue with Access Code</button>
            </form>
            <p class="footer">Have a code? Use it for your plan's time and speed.</p>
        </div>
    </main>

    <script>
        const statusBox = document.getElementById('status-box');
        let countdownTimer = null;

        function showMessage(msg, isError = false) {
            statusBox.textContent = msg;
            statusBox.className = 'status ' + (isError ? 'error' : 'success');
            statusBox.style.display = 'block';
        }

        async function checkStatus() {
            try {
                const res = await fetch('/api/v1/guests/status');
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Unable to check access');
                const starter = data.plans?.find(plan => plan.plan_id === 'starter');
                const starterCard = document.getElementById('starter-card');
                if (starterCard) starterCard.hidden = !starter;
                if (data.authorized && data.session) {
                    renderConnected(data.session);
                }
            } catch (err) {
                console.error("Status check failed", err);
            }
        }

        function renderConnected(session) {
            clearInterval(countdownTimer);
            const content = document.getElementById('portal-content');
            const expiresAt = new Date(session.expires_at).getTime();
            
            content.innerHTML = `
                <div class="connected-box">
                    <h2>Access enabled</h2>
                    <div class="timer" id="time-left" role="timer" aria-label="Time remaining">--:--</div>
                    <p class="muted">Time remaining</p>
                    <p class="session-details" id="session-details"></p>
                </div>
            `;
            document.getElementById('session-details').textContent =
                `${session.plan_id === 'starter' ? 'Guest' : session.plan_id} · ${session.speed_limit_mbps ? session.speed_limit_mbps + ' Mbps' : 'Standard speed'}`;

            function updateTimer() {
                const now = Date.now();
                const diff = Math.max(0, Math.floor((expiresAt - now) / 1000));
                const mins = Math.floor(diff / 60);
                const secs = diff % 60;
                const timerElem = document.getElementById('time-left');
                if (timerElem) {
                    timerElem.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                }
                if (diff <= 0) {
                    clearInterval(countdownTimer);
                    location.reload();
                }
            }

            updateTimer();
            countdownTimer = setInterval(updateTimer, 1000);
        }

        async function connect(payload, btn) {
            if (btn) btn.disabled = true;
            statusBox.style.display = 'none';
            try {
                const res = await fetch('/api/v1/guests/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const d = await res.json();
                if (!res.ok) throw new Error(d.detail || d.error || 'Connection failed');
                showMessage('Internet access granted! Activating session…');
                renderConnected(d.session);
            } catch (err) {
                showMessage(err.message, true);
                if (btn) btn.disabled = false;
            }
        }

        document.getElementById('starter-btn').onclick = (e) => {
            connect({ plan_id: 'starter' }, e.target);
        };

        document.getElementById('voucher-form').onsubmit = (e) => {
            e.preventDefault();
            const code = document.getElementById('voucher-code').value.trim();
            if (code) connect({ voucher: code }, document.getElementById('voucher-btn'));
        };

        checkStatus();
    </script>
</body>
</html>
