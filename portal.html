<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="csrf-token" content="__CSRF__">
    <title>OshinWiFi · Admin portal</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
</head>

<body>
    <aside class="sidebar" id="sidebar">
        <div class="brand"><span class="logo">◉</span> OshinWiFi</div>
        <div class="eyebrow">WORKSPACE</div>
        <nav aria-label="Main navigation"><a href="/dashboard"><span class="icon">▦</span>Dashboard</a><a
                href="/wifi"><span class="icon">⌁</span>Wifi Settings</a><a href="/devices"><span
                    class="icon">▣</span>Connected Device</a><a href="/filtering"><span class="icon">⊘</span>Device

            <div class="heading">
                <div>
                    <h1 id="title">Dashboard</h1>
                    <p id="subtitle">Your network overview.</p>
                </div><button class="secondary" id="refresh">↻ Refresh</button>
